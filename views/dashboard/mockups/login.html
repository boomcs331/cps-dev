<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>หน้าจอเข้าสู่ระบบ (Mockup)</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f6fb;
        --card-bg: #ffffff;
        --accent: #2563eb;
        --accent-weak: rgba(37, 99, 235, 0.15);
        --text: #1f2933;
        --muted: #6c7a89;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-image: radial-gradient(
            circle at 20% 20%,
            rgba(37, 99, 235, 0.08),
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 0%,
            rgba(37, 99, 235, 0.12),
            transparent 55%
          );
      }

      .login-card {
        width: min(420px, 92vw);
        background: var(--card-bg);
        border-radius: 18px;
        box-shadow: 0 20px 50px rgba(31, 41, 51, 0.12);
        padding: 32px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .card-header {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .brand {
        font-size: 14px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 600;
      }

      .headline {
        font-size: 28px;
        font-weight: 600;
        margin: 0;
      }

      .subtext {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      label {
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .input-wrapper {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      input {
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid rgba(31, 41, 51, 0.15);
        font-size: 15px;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 4px var(--accent-weak);
      }

      .action-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 14px;
      }

      .remember {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }

      .remember input {
        width: 16px;
        height: 16px;
        margin: 0;
      }

      .link {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }

      button {
        padding: 14px 18px;
        border-radius: 12px;
        border: none;
        background-color: var(--accent);
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 30px rgba(37, 99, 235, 0.2);
      }

      .footer-text {
        text-align: center;
        font-size: 14px;
        color: var(--muted);
      }

      @media (max-width: 480px) {
        .login-card {
          padding: 28px 24px;
        }

        .headline {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="card-header">
        <span class="brand">CPS Admin</span>
        <h1 class="headline">เข้าสู่ระบบเพื่อจัดการการผลิต</h1>
        <p class="subtext">
          เข้าสู่แผงควบคุมเพื่อตรวจสอบข้อมูลการผลิต ผู้ใช้ และสิทธิ์การใช้งาน
        </p>
      </div>

      <form>
        <div class="input-wrapper">
          <label for="username">ชื่อผู้ใช้</label>
          <input
            id="username"
            name="username"
            type="text"
            placeholder="ชื่อผู้ใช้ของคุณ"
          />
        </div>

        <div class="input-wrapper">
          <label for="password">รหัสผ่าน</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="••••••••"
          />
        </div>

        <div class="action-row">
          <label class="remember">
            <input type="checkbox" name="remember" />
            จำฉันไว้
          </label>
          <a class="link" href="#">ลืมรหัสผ่าน?</a>
        </div>

        <button type="submit">เข้าสู่ระบบ</button>
      </form>

      <p class="footer-text">
        ยังไม่มีบัญชี? <a class="link" href="#">ส่งคำขอเพื่อเข้าถึงระบบ</a>
      </p>
    </div>
  </body>
</html>
